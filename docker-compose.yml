# Local dev: Postgres+pgvector and the FastAPI backend.
# Mirrors production (RDS pgvector + Fargate) so local == prod, one clean path.
services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 with the pgvector extension built in
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://meetings:meetings@db:5432/meetings
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
